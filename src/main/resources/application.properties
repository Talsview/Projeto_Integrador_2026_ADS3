spring.application.name=oficina-mecanica
server.port=9081

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# PostgreSQL local
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/car_repair
spring.datasource.username=postgres
spring.datasource.password=1234

# O banco fisico sera criado por script SQL manual/versionado.
# O Hibernate apenas valida se as tabelas existem e se batem com os Models.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.http.codec.max-in-memory-size=50MB
